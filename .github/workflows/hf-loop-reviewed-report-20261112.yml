name: HF reviewed report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=0.36,<2'
      - env:
          HF_TOKEN: ${{ secrets.LOOP_HF_UPLOAD_20261112 }}
          REPORT_B64: 
        run: |
          python - <<'PY'
          import os,base64,hashlib
          for k in ('HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','http_proxy','https_proxy','all_proxy'):os.environ.pop(k,None)
          os.environ['NO_PROXY']='*'
          from huggingface_hub import HfApi,hf_hub_download
          token=os.environ['HF_TOKEN'];api=HfApi(token=token);repo=api.whoami()['name']+'/loop';name='FINAL_RESEARCH_REPORT_reviewed_20261112.md'
          if api.repo_info(repo,repo_type='dataset').private or api.file_exists(repo_id=repo,repo_type='dataset',filename=name):raise RuntimeError('private repo or report path exists')
          content=base64.b64decode(os.environ['REPORT_B64']);api.upload_file(path_or_fileobj=content,path_in_repo=name,repo_id=repo,repo_type='dataset',commit_message='Add reviewed in-progress research report')
          path=hf_hub_download(repo_id=repo,repo_type='dataset',filename=name,token=token,force_download=True)
          if hashlib.sha256(open(path,'rb').read()).digest()!=hashlib.sha256(content).digest():raise RuntimeError('SHA mismatch')
          print('REVIEWED_REPORT_VERIFIED https://huggingface.co/datasets/'+repo+'/blob/main/'+name+' sha256='+hashlib.sha256(content).hexdigest())
          PY
