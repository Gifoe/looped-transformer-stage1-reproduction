name: HF remote inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Inventory public dataset
        run: |
          python - <<'PY'
          import os,json,hashlib,datetime
          for k in ('HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','http_proxy','https_proxy','all_proxy'): os.environ.pop(k,None)
          os.environ['NO_PROXY']='*'
          from huggingface_hub import HfApi
          api=HfApi();repo='gifoe/loop';info=api.repo_info(repo_id=repo,repo_type='dataset')
          if info.private:raise RuntimeError('dataset not public')
          entries=[]
          for item in api.list_repo_tree(repo_id=repo,repo_type='dataset',recursive=True,expand=True):
              if not hasattr(item,'size'):continue
              lfs=getattr(item,'lfs',None)
              entries.append({'path':item.path,'size':item.size,'lfs_sha256':getattr(lfs,'sha256',None),'git_blob_id':getattr(item,'blob_id',None)})
          entries.sort(key=lambda x:x['path']);payload={'observed_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'repository':repo,'head':info.sha,'file_count':len(entries),'sum_bytes':sum(x['size'] or 0 for x in entries),'files':entries}
          with open('hf-remote-inventory.json','w',encoding='utf8') as f:json.dump(payload,f,ensure_ascii=False,indent=2)
          print('REMOTE_INVENTORY files='+str(len(entries))+' bytes='+str(payload['sum_bytes'])+' head='+str(info.sha)+' sha256='+hashlib.sha256(open('hf-remote-inventory.json','rb').read()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hf-remote-inventory
          path: hf-remote-inventory.json
          retention-days: 7
